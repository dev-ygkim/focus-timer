  <rect width="1024" height="1024" fill="none"/>
  <rect x="72" y="72" width="880" height="880" rx="228" fill="url(#background)"/>
  <rect x="94" y="94" width="836" height="836" rx="206" fill="none" stroke="#8fe7d5" stroke-opacity="0.12" stroke-width="4"/>

