<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Focus Timer Quiet Arc 앱 아이콘</title>
  <desc id="desc">차콜색 둥근 사각형 위에 청록색 집중 진행 아크와 중앙 포커스 마커가 있는 미니멀 macOS 앱 아이콘입니다.</desc>
  <defs>
    <linearGradient id="background" x1="122" y1="100" x2="892" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29383a"/>
      <stop offset="0.52" stop-color="#1c2729"/>
      <stop offset="1" stop-color="#151d1f"/>
    </linearGradient>
    <linearGradient id="arc" x1="286" y1="224" x2="754" y2="766" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94ead8"/>
