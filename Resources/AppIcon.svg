    <path d="M512 236 A276 276 0 1 1 270 643" fill="none" stroke="url(#arc)" stroke-linecap="round" stroke-width="46"/>
    <path d="M257 690 A276 276 0 0 1 245 628" fill="none" stroke="#93e9d7" stroke-linecap="round" stroke-width="46"/>
  </g>

  <path d="M512 382 V462" fill="none" stroke="#edf8f6" stroke-linecap="round" stroke-width="28"/>
  <circle cx="512" cy="534" r="38" fill="#edf8f6"/>
