<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Focus Timer 메뉴 막대, 설정, 구간 종료 알림 시안</title>
  <desc id="desc">어두운 macOS 화면 위에 Focus Timer 메뉴 막대 상태, 집중 타이머 팝오버, 소리와 macOS 알림 설정, 집중 종료 배너를 보여 주는 UI 시안입니다.</desc>
  <defs>
    <linearGradient id="focus" x1="0" x2="1"><stop stop-color="#58c8b7"/><stop offset="1" stop-color="#7ee0ce"/></linearGradient>
    <linearGradient id="notice" x1="0" x2="1"><stop stop-color="#6d61ba"/><stop offset="1" stop-color="#a89bf2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#78d6c5"/></marker>
    <style>
      .bg{fill:#131617}.bar{fill:#222728}.card{fill:#262c2e}.card2{fill:#1d2324}.title{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f3f7f6}.subtitle{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#aebbbb}.caption{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#78d6c5;letter-spacing:1.3px}.body{font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e7eeee}.small{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#aab7b7}.timer{font:300 88px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f4f7f7;letter-spacing:-4px}.num{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f1f6f5}.button{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#102220}.buttonAlt{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbe8e6}.input{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf3f2}.switch{fill:#78d6c5}.switchDot{fill:#f7fbfa}
    </style>
  </defs>
  <rect class="bg" width="1440" height="980"/>
  <rect class="bar" x="0" y="0" width="1440" height="52"/>
  <circle cx="27" cy="26" r="7" fill="#78d6c5"/>
  <text class="body" x="44" y="32">Focus Timer</text>
  <text class="small" x="1092" y="32">Wed 9:41 AM</text>
  <rect x="1192" y="8" width="135" height="36" rx="9" fill="#334847"/>
  <circle cx="1214" cy="26" r="6" fill="#78d6c5"/>
  <text class="num" x="1229" y="32">집중 24:37</text>
  <circle cx="1352" cy="26" r="3" fill="#aebbbb"/><circle cx="1364" cy="26" r="3" fill="#aebbbb"/><circle cx="1376" cy="26" r="3" fill="#aebbbb"/>

  <text class="title" x="74" y="111">Focus Timer</text>
  <text class="subtitle" x="74" y="140">메뉴 막대에서 현재 단계와 남은 시간을 읽고, 구간 종료 알림을 관리합니다.</text>
  <text class="caption" x="74" y="194">A · MENU BAR STATUS</text>
  <path d="M1248 58 V107 H1040" fill="none" stroke="#78d6c5" stroke-width="2" stroke-dasharray="5 6"/>
  <text class="small" x="1046" y="100">항상 표시: 단계 + MM:SS</text>

  <g filter="url(#shadow)"><rect class="card" x="74" y="220" width="486" height="632" rx="24"/></g>
  <text class="caption" x="108" y="265">B · TIMER POPOVER</text>
  <circle cx="117" cy="305" r="6" fill="#78d6c5"/>
  <text class="body" x="132" y="311">집중 중</text>
  <text class="small" x="436" y="311">1 / 4 집중</text>
  <line x1="108" y1="336" x2="526" y2="336" stroke="#3c4849"/>
  <text class="timer" x="143" y="454">24:37</text>
  <rect x="109" y="491" width="416" height="8" rx="4" fill="#354143"/>
  <rect x="109" y="491" width="184" height="8" rx="4" fill="url(#focus)"/>
  <text class="small" x="109" y="530">집중 시간 25분 중 23% 경과</text>
  <circle cx="202" cy="577" r="8" fill="#78d6c5"/><circle cx="226" cy="577" r="8" fill="#3b5d59"/><circle cx="250" cy="577" r="8" fill="#3b5d59"/><circle cx="274" cy="577" r="8" fill="#3b5d59"/>
  <text class="small" x="296" y="582">기본 집중 4회 표시</text>
  <rect x="108" y="630" width="417" height="54" rx="13" fill="url(#focus)"/>
  <rect x="229" y="646" width="4" height="22" rx="2" fill="#102220"/><rect x="240" y="646" width="4" height="22" rx="2" fill="#102220"/>
  <text class="button" x="260" y="664">일시정지</text>
  <rect x="108" y="702" width="202" height="50" rx="12" fill="#303a3b"/><text class="buttonAlt" x="177" y="733">↺ 재설정</text>
  <rect x="323" y="702" width="202" height="50" rx="12" fill="#303a3b"/><text class="buttonAlt" x="389" y="733">⚙ 설정</text>
  <text class="small" x="108" y="804">다음 단계</text>
  <text class="body" x="108" y="830">휴식 · 05:00</text>

  <text class="caption" x="610" y="194">C · SETTINGS</text>
  <g filter="url(#shadow)"><rect class="card" x="610" y="220" width="432" height="632" rx="24"/></g>
  <text class="title" x="646" y="272">설정</text>
  <text class="subtitle" x="646" y="298">다음 타이머와 구간 종료 알림을 만듭니다.</text>
  <line x1="646" y1="325" x2="1006" y2="325" stroke="#3c4849"/>
  <text class="body" x="646" y="365">집중 시간</text>
  <rect class="card2" x="646" y="380" width="230" height="45" rx="10" stroke="#506263"/><text class="input" x="668" y="411">25</text><text class="small" x="840" y="411">분</text>
  <text class="body" x="646" y="464">휴식 시간</text>
  <rect class="card2" x="646" y="479" width="230" height="45" rx="10" stroke="#506263"/><text class="input" x="668" y="510">5</text><text class="small" x="840" y="510">분</text>
  <text class="body" x="646" y="563">집중 횟수</text>
  <rect class="card2" x="646" y="578" width="230" height="45" rx="10" stroke="#506263"/><text class="input" x="668" y="609">4</text><text class="small" x="840" y="609">회</text>
  <line x1="646" y1="649" x2="1006" y2="649" stroke="#3c4849"/>
  <text class="body" x="646" y="684">구간 종료 알림</text>
  <text class="small" x="646" y="716">소리 알림</text>
  <rect class="switch" x="883" y="697" width="48" height="25" rx="13"/><circle class="switchDot" cx="918" cy="709.5" r="10"/>
  <text class="small" x="646" y="752">macOS 알림</text>
  <rect class="switch" x="883" y="733" width="48" height="25" rx="13"/><circle class="switchDot" cx="918" cy="745.5" r="10"/>
  <text class="small" x="646" y="784">마지막 집중 뒤에는 휴식 없음</text>
  <rect x="646" y="799" width="360" height="39" rx="11" fill="url(#focus)"/><text class="button" x="806" y="825">적용</text>

  <text class="caption" x="1093" y="194">D · END ALERT</text>
  <g filter="url(#shadow)"><rect class="card" x="1092" y="220" width="274" height="242" rx="24"/></g>
  <circle cx="1128" cy="268" r="17" fill="url(#notice)"/>
  <path d="M1122 268 H1134 M1124 262 V274 M1132 262 V274" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text class="body" x="1158" y="267">Focus Timer</text>
  <text class="small" x="1158" y="290">방금</text>
  <line x1="1125" y1="314" x2="1332" y2="314" stroke="#3c4849"/>
  <text class="body" x="1125" y="350">집중 완료</text>
  <text class="small" x="1125" y="379">휴식 5분을 시작합니다.</text>
  <text class="small" x="1125" y="421">소리 알림 · 켜짐  /  macOS 알림 · 켜짐</text>
  <text class="small" x="1092" y="506">마지막 집중 종료 시: “타이머 완료” 알림</text>
  <path d="M1228 532 V615" stroke="#78d6c5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1092" y="640" width="274" height="198" rx="20" fill="#202728" stroke="#3c4849"/>
  <text class="body" x="1124" y="681">알림 전송 규칙</text>
  <text class="small" x="1124" y="714">집중 종료 → 휴식 시작</text>
  <text class="small" x="1124" y="741">휴식 종료 → 다음 집중 시작</text>
  <text class="small" x="1124" y="768">마지막 집중 종료 → 완료</text>
  <text class="small" x="1124" y="807">각 이벤트에서 설정된 알림만 1회</text>

  <text class="small" x="74" y="924">시안 원칙: 큰 시간, 한 화면의 최소 조작, 명확한 알림 설정, 집중/휴식 텍스트 병기</text>
</svg>
