<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Focus Timer 아이콘 시안 1: 포커스 프레임</title>
  <desc id="desc">짙은 차콜색 둥근 사각형 위에 청록색 포커스 프레임과 중앙 집중점을 배치한 macOS 앱 아이콘입니다.</desc>
