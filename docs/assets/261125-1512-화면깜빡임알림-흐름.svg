<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="604" viewBox="0 0 1240 604" role="img" aria-labelledby="title desc">
  <title id="title">단계 전환 알림 흐름 — 변경 전 / 변경 후</title>
  <desc id="desc">변경 전에는 단계가 자연 종료되면 소리와 macOS 알림만 보내 창이 닫혀 있으면 놓치기 쉽습니다. 변경 후에는 같은 지점에서 화면 깜빡임 알림이 켜져 있으면 포커스를 빼앗지 않고 창을 띄워 3회 깜빡인 뒤 단계 색 테두리를 남깁니다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a9597"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78d6c5"/></marker>
    <style>
      text{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#ebf5f2}
      .bg{fill:#101415}.lane{fill:#192021;stroke:#354143;stroke-width:1.5}
      .box{fill:#222b2d;stroke:#4d6061;stroke-width:1.5}.new{fill:#1d3533;stroke:#78d6c5;stroke-width:2}
      .warn{fill:#2d2020;stroke:#f56e6b;stroke-width:1.5}
      .h{font-size:22px;font-weight:700}.lbl{font-size:15px;font-weight:700;fill:#9eb3b0}.lbl.n{fill:#78d6c5}
      .t{font-size:14px;font-weight:600}.s{font-size:12px;fill:#9eb3b0}.mute{font-size:12px;fill:#8a9597}
      .ln{fill:none;stroke:#8a9597;stroke-width:1.6}.ln.n{stroke:#78d6c5;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1240" height="604"/>
  <text class="h" x="24" y="44">단계 전환 알림 흐름</text>

  <!-- 변경 전 -->
  <rect class="lane" x="24" y="72" width="1192" height="164" rx="14"/>
  <text class="lbl" x="44" y="98">변경 전</text>
  <rect class="box" x="44" y="136" width="180" height="56" rx="10"/><text class="t" x="134" y="160" text-anchor="middle">1초 틱</text><text class="s" x="134" y="179" text-anchor="middle">refreshCountdown()</text>
  <rect class="box" x="254" y="136" width="190" height="56" rx="10"/><text class="t" x="349" y="160" text-anchor="middle">남은 시간 0초</text><text class="s" x="349" y="179" text-anchor="middle">finishCurrentPhase()</text>
  <rect class="box" x="474" y="136" width="200" height="56" rx="10"/><text class="t" x="574" y="160" text-anchor="middle">AlertService.send</text><text class="s" x="574" y="179" text-anchor="middle">설정에 따라 알림</text>
  <rect class="box" x="704" y="108" width="170" height="48" rx="10"/><text class="t" x="789" y="137" text-anchor="middle">소리 N회 반복</text>
  <rect class="box" x="704" y="176" width="170" height="48" rx="10"/><text class="t" x="789" y="205" text-anchor="middle">macOS 알림 배너</text>
  <rect class="warn" x="904" y="136" width="290" height="56" rx="10"/><text class="t" x="1049" y="160" text-anchor="middle">창이 닫혀 있으면</text><text class="s" x="1049" y="179" text-anchor="middle">소리·배너를 놓치면 전환을 모름</text>
  <path class="ln" d="M224,164 H254" marker-end="url(#a)"/>
  <path class="ln" d="M444,164 H474" marker-end="url(#a)"/>
  <path class="ln" d="M674,164 H689 V132 H704" marker-end="url(#a)"/>
  <path class="ln" d="M689,164 V200 H704" marker-end="url(#a)"/>
  <path class="ln" d="M874,132 H889 V164 H904" marker-end="url(#a)"/>
  <path class="ln" d="M874,200 H889 V164" />

  <!-- 변경 후 -->
  <rect class="lane" x="24" y="260" width="1192" height="320" rx="14"/>
  <text class="lbl n" x="44" y="286">변경 후</text>
  <rect class="box" x="44" y="380" width="180" height="56" rx="10"/><text class="t" x="134" y="404" text-anchor="middle">1초 틱</text><text class="s" x="134" y="423" text-anchor="middle">refreshCountdown()</text>
  <rect class="box" x="254" y="380" width="190" height="56" rx="10"/><text class="t" x="349" y="404" text-anchor="middle">남은 시간 0초</text><text class="s" x="349" y="423" text-anchor="middle">finishCurrentPhase()</text>
  <rect class="box" x="474" y="300" width="320" height="56" rx="10"/><text class="t" x="634" y="324" text-anchor="middle">AlertService.send</text><text class="s" x="634" y="343" text-anchor="middle">소리 · macOS 알림 (기존 그대로)</text>

  <rect class="new" x="474" y="420" width="160" height="56" rx="10"/><text class="t" x="554" y="444" text-anchor="middle">깜빡임 켜짐?</text><text class="s" x="554" y="463" text-anchor="middle">설정 토글</text>
  <rect class="new" x="654" y="420" width="160" height="56" rx="10"/><text class="t" x="734" y="444" text-anchor="middle">창 표시</text><text class="s" x="734" y="463" text-anchor="middle">입력 포커스 유지</text>
  <rect class="new" x="834" y="420" width="160" height="56" rx="10"/><text class="t" x="914" y="444" text-anchor="middle">3회 깜빡임</text><text class="s" x="914" y="463" text-anchor="middle">약 2.6초 · 단계 색</text>
  <rect class="new" x="1014" y="420" width="180" height="56" rx="10"/><text class="t" x="1104" y="444" text-anchor="middle">단계 색 테두리</text><text class="s" x="1104" y="463" text-anchor="middle">닫힐 때까지 유지</text>
  <rect class="box" x="1014" y="506" width="180" height="56" rx="10"/><text class="t" x="1104" y="530" text-anchor="middle">바깥 클릭 → 닫힘</text><text class="s" x="1104" y="549" text-anchor="middle">고정 중이면 투명도 복귀</text>

  <text class="mute" x="474" y="500">꺼짐 → 지금과 동일 (소리·배너만)</text>
  <text class="mute" x="834" y="500">동작 줄이기 켬 → 1회만 표시</text>

  <path class="ln" d="M224,408 H254" marker-end="url(#a)"/>
  <path class="ln" d="M444,408 H459 V328 H474" marker-end="url(#a)"/>
  <path class="ln n" d="M459,408 V448 H474" marker-end="url(#m)"/>
  <path class="ln n" d="M634,448 H654" marker-end="url(#m)"/>
  <path class="ln n" d="M814,448 H834" marker-end="url(#m)"/>
  <path class="ln n" d="M994,448 H1014" marker-end="url(#m)"/>
  <path class="ln" d="M1104,476 V506" marker-end="url(#a)"/>
</svg>
