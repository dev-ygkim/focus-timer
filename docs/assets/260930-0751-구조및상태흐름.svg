<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Focus Timer 구성, 프로필, 종료 알림 및 상태 흐름</title>
  <desc id="desc">왼쪽에는 메뉴 막대 UI, 설정과 프로필, 상태 저장소, 시간원, 사용자 설정과 최대 10개의 프로필, 소리와 로컬 알림 서비스의 구성 관계가 있고 오른쪽에는 프로필 즉시 실행과 종료 알림이 포함된 상태 전이가 있습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78d6c5"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a9597"/></marker>
    <style>
      .bg{fill:#101415}.panel{fill:#192021;stroke:#354143;stroke-width:1.5}.box{fill:#222b2d;stroke:#4d6061;stroke-width:1.5}.state{fill:#203638;stroke:#78d6c5;stroke-width:2}.pause{fill:#292b36;stroke:#aea8e8;stroke-width:2}.done{fill:#303035;stroke:#bbc2c3;stroke-width:2}.decision{fill:#243033;stroke:#d5c57d;stroke-width:2}.alert{fill:#332f42;stroke:#b9a7ff;stroke-width:1.8}.profile{fill:#243844;stroke:#74b5d3;stroke-width:1.8}.title{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f1f5f4}.heading{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dfe7e5}.label{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#eff4f3}.small{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#aebbbb}.note{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8a999a}.line{stroke:#78d6c5;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.muted{stroke:#8a9597;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowMuted)}.alertline{stroke:#b9a7ff;stroke-width:2;stroke-dasharray:5 5;fill:none;marker-end:url(#arrow)}.profileline{stroke:#74b5d3;stroke-width:2;stroke-dasharray:5 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="760" rx="18"/>
  <text class="title" x="54" y="58">Focus Timer · 구성, 프로필, 종료 알림, 상태 전이</text>
  <text class="note" x="54" y="86">프로필 실행은 세 타이머 값을 적용해 집중 1회차를 즉시 시작합니다. 각 자연 종료 이벤트만 소리·로컬 알림에 전달됩니다.</text>

  <rect class="panel" x="42" y="120" width="614" height="588" rx="16"/>
  <text class="heading" x="72" y="158">앱 구성</text>
  <rect class="box" x="70" y="190" width="220" height="104" rx="12"/>
  <text class="label" x="101" y="232">MenuBarExtra</text>
  <text class="small" x="101" y="258">메뉴 막대 시간 · 팝오버</text>
  <rect class="profile" x="365" y="190" width="220" height="104" rx="12"/>
  <text class="label" x="396" y="232">Settings + Profiles</text>
  <text class="small" x="389" y="258">타이머 · 알림 · 프로필</text>
  <path class="line" d="M290 242 H348"/>
  <path class="profileline" d="M475 294 V345 H456"/>
  <path class="line" d="M180 294 V345 H221"/>
  <rect class="state" x="221" y="316" width="236" height="126" rx="14"/>
  <text class="label" x="266" y="360">PomodoroStore</text>
  <text class="small" x="248" y="388">단계 · 남은 시간 · 집중 횟수</text>
  <text class="small" x="239" y="412">종료 이벤트 · 프로필 즉시 실행</text>

  <rect class="box" x="70" y="514" width="158" height="106" rx="12"/>
  <text class="label" x="106" y="556">시간원</text>
  <text class="small" x="82" y="582">1초 갱신 + endDate</text>
  <rect class="profile" x="250" y="514" width="158" height="106" rx="12"/>
  <text class="label" x="265" y="550">UserDefaults</text>
  <text class="small" x="263" y="576">전역 설정 + profiles</text>
  <text class="note" x="283" y="598">최대 10개</text>
  <rect class="alert" x="430" y="514" width="158" height="106" rx="12"/>
  <text class="label" x="452" y="550">AlertService</text>
  <text class="small" x="447" y="576">시스템음 + 로컬 알림</text>
  <text class="note" x="459" y="598">권한·토글 반영</text>
  <path class="line" d="M270 441 L150 506"/>
  <path class="profileline" d="M339 442 V506"/>
  <path class="alertline" d="M410 442 L505 506"/>
  <text class="note" x="78" y="669">네트워크, 계정, 분석 수집은 사용하지 않음</text>

  <rect class="panel" x="698" y="120" width="700" height="588" rx="16"/>
  <text class="heading" x="728" y="158">상태 전이와 종료 알림</text>
  <rect class="box" x="724" y="211" width="144" height="82" rx="40"/>
  <text class="label" x="765" y="244">준비</text>
  <text class="small" x="744" y="268">집중 25:00</text>
  <rect class="state" x="931" y="211" width="168" height="82" rx="40"/>
  <text class="label" x="969" y="244">진행(집중)</text>
  <text class="small" x="961" y="268">0초까지 자동 실행</text>
  <path class="line" d="M868 252 H916"/>
  <text class="note" x="871" y="235">시작 · 프로필 실행</text>

  <polygon class="decision" points="1246,174 1324,248 1246,322 1168,248"/>
  <text class="label" x="1194" y="240">현재 집중 &lt;</text>
  <text class="label" x="1199" y="262">설정 횟수?</text>
  <path class="line" d="M1099 252 H1153"/>
  <text class="note" x="1106" y="235">0초 · 집중 종료 알림</text>

  <rect class="state" x="922" y="466" width="181" height="82" rx="40"/>
  <text class="label" x="962" y="499">진행(휴식)</text>
  <text class="small" x="955" y="523">설정된 휴식 시간</text>
  <path class="line" d="M1180 286 H1012 V451"/>
  <text class="note" x="1040" y="333">예</text>
  <path class="line" d="M922 507 H844 V336 H931"/>
  <text class="note" x="735" y="421">0초 · 휴식 종료 알림 · 집중 횟수 +1</text>

  <rect class="done" x="1180" y="466" width="174" height="82" rx="40"/>
  <text class="label" x="1238" y="499">완료</text>
  <text class="small" x="1205" y="523">마지막 휴식 없음</text>
  <path class="line" d="M1312 286 V507 H1369"/>
  <text class="note" x="1324" y="365">아니오 · 완료 알림</text>

  <rect class="alert" x="1018" y="590" width="336" height="72" rx="14"/>
  <text class="label" x="1044" y="621">자연 종료 이벤트 → AlertService</text>
  <text class="small" x="1044" y="646">켜진 설정만: 시스템음 1회 · macOS 로컬 배너</text>
  <path class="alertline" d="M1246 548 V580"/>
  <rect class="profile" x="722" y="587" width="273" height="74" rx="14"/>
  <text class="label" x="747" y="617">프로필 실행</text>
  <text class="small" x="747" y="641">값 적용 → 집중 1 시작 · 종료 알림 없음</text>
  <path class="profileline" d="M856 587 V337 H931"/>
  <text class="note" x="728" y="685">재설정: 어느 상태에서나 준비(집중)로 돌아가며 알림은 보내지 않음</text>
</svg>
