<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Focus Timer 구성과 상태 전이</title>
  <desc id="desc">왼쪽은 MenuBarController, TimerPopoverView, PomodoroStore, ProfileStore, AlertService, UserDefaults의 구성 관계이고, 오른쪽은 준비, 진행(집중), 마지막 집중 판단, 진행(휴식), 완료 사이의 상태 전이와 종료 알림입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78d6c5"/></marker>
    <marker id="arrowProfile" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#74b5d3"/></marker>
    <marker id="arrowAlert" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9a7ff"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a9597"/></marker>
    <style>
      .bg{fill:#101415}.panel{fill:#192021;stroke:#354143;stroke-width:1.5}.box{fill:#222b2d;stroke:#4d6061;stroke-width:1.5}.state{fill:#203638;stroke:#78d6c5;stroke-width:2}.done{fill:#303035;stroke:#bbc2c3;stroke-width:2}.decision{fill:#243033;stroke:#d5c57d;stroke-width:2}.alert{fill:#332f42;stroke:#b9a7ff;stroke-width:1.8}.profile{fill:#243844;stroke:#74b5d3;stroke-width:1.8}
      .title{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f1f5f4}.heading{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dfe7e5}.label{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#eff4f3}.small{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#aebbbb}.note{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8a999a}.alertnote{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b9a7ff}
      .mid{text-anchor:middle}.end{text-anchor:end}
      .line{stroke:#78d6c5;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.profileline{stroke:#74b5d3;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowProfile)}.alertline{stroke:#b9a7ff;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowAlert)}.muted{stroke:#8a9597;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowMuted)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="780" rx="18"/>
  <text class="title" x="54" y="58">Focus Timer · 구성과 상태 전이</text>
  <text class="note" x="54" y="86">메뉴바 아이콘과 창은 MenuBarController가 직접 관리합니다. 자연 종료 이벤트만 소리·macOS 로컬 알림으로 전달됩니다.</text>

  <!-- 앱 구성 -->
  <rect class="panel" x="40" y="120" width="640" height="620" rx="16"/>
  <text class="heading" x="70" y="158">앱 구성</text>

  <rect class="box" x="70" y="190" width="260" height="90" rx="12"/>
  <text class="label mid" x="200" y="222">MenuBarController</text>
  <text class="small mid" x="200" y="246">NSStatusItem + NSPanel</text>
  <text class="note mid" x="200" y="266">메뉴바 시간 · 창 열기/닫기 · 항상 켜두기</text>

  <rect class="box" x="400" y="190" width="250" height="90" rx="12"/>
  <text class="label mid" x="525" y="222">TimerPopoverView</text>
  <text class="small mid" x="525" y="246">타이머 화면</text>
  <text class="note mid" x="525" y="266">설정 · 프로필 패널로 전환</text>

  <rect class="state" x="70" y="350" width="260" height="90" rx="12"/>
  <text class="label mid" x="200" y="382">PomodoroStore</text>
  <text class="small mid" x="200" y="406">1초 갱신 + endDate</text>
  <text class="note mid" x="200" y="426">PomodoroState로 상태 전이 계산</text>

  <rect class="profile" x="400" y="350" width="250" height="90" rx="12"/>
  <text class="label mid" x="525" y="382">ProfileStore</text>
  <text class="small mid" x="525" y="406">프로필 저장 · 삭제</text>
  <text class="note mid" x="525" y="426">최대 10개</text>

  <rect class="alert" x="70" y="530" width="260" height="90" rx="12"/>
  <text class="label mid" x="200" y="562">AlertService</text>
  <text class="small mid" x="200" y="586">전환음 · 시스템 사운드 · 1~5회 반복</text>
  <text class="note mid" x="200" y="606">macOS 로컬 알림 (켜진 설정만)</text>

  <rect class="box" x="400" y="530" width="250" height="90" rx="12"/>
  <text class="label mid" x="525" y="562">UserDefaults</text>
  <text class="small mid" x="525" y="586">타이머 · 알림 설정</text>
  <text class="note mid" x="525" y="606">프로필 목록</text>

  <path class="line" d="M330 235 H400"/>
  <text class="note mid" x="365" y="226">창에 표시</text>

  <path class="line" d="M470 280 V315 H290 V350"/>
  <text class="note" x="300" y="338">버튼 조작</text>

  <path class="line" d="M120 350 V280"/>
  <text class="note" x="130" y="320">메뉴바 시간 갱신</text>

  <path class="profileline" d="M590 280 V350"/>
  <text class="note end" x="582" y="320">프로필 패널</text>

  <path class="alertline" d="M200 440 V530"/>
  <text class="alertnote end" x="192" y="490">자연 종료 시</text>

  <path class="muted" d="M300 440 V485 H440 V530"/>
  <text class="note" x="330" y="477">설정 저장</text>

  <path class="profileline" d="M560 440 V530"/>
  <text class="note" x="570" y="490">프로필 저장</text>

  <text class="note" x="70" y="676">AppDelegate가 실행 시 PomodoroStore · ProfileStore로 MenuBarController를 만듭니다.</text>
  <text class="note" x="70" y="700">네트워크, 계정, 분석 수집은 사용하지 않습니다.</text>

  <!-- 상태 전이 -->
  <rect class="panel" x="712" y="120" width="688" height="620" rx="16"/>
  <text class="heading" x="742" y="158">상태 전이와 종료 알림</text>

  <rect class="box" x="740" y="190" width="160" height="72" rx="36"/>
  <text class="label mid" x="820" y="221">준비</text>
  <text class="small mid" x="820" y="244">집중 1 · 정지</text>
  <text class="note mid" x="820" y="286">앱 실행 · 설정 적용 직후</text>

  <rect class="state" x="980" y="190" width="180" height="72" rx="36"/>
  <text class="label mid" x="1070" y="221">진행(집중)</text>
  <text class="small mid" x="1070" y="244">남은 시간 카운트다운</text>

  <polygon class="decision" points="1070,330 1160,380 1070,430 980,380"/>
  <text class="label mid" x="1070" y="376">마지막</text>
  <text class="label mid" x="1070" y="397">집중인가?</text>

  <rect class="state" x="980" y="500" width="180" height="72" rx="36"/>
  <text class="label mid" x="1070" y="531">진행(휴식)</text>
  <text class="small mid" x="1070" y="554">설정된 휴식 시간</text>

  <rect class="done" x="1240" y="500" width="140" height="72" rx="36"/>
  <text class="label mid" x="1310" y="531">완료</text>
  <text class="small mid" x="1310" y="554">마지막 휴식 없음</text>

  <path class="line" d="M900 226 H980"/>
  <text class="note mid" x="940" y="216">시작</text>

  <path class="line" d="M1070 262 V330"/>
  <text class="note" x="1080" y="301">0초</text>

  <path class="line" d="M1160 380 H1310 V500"/>
  <text class="note" x="1172" y="370">예</text>
  <text class="alertnote end" x="1300" y="450">타이머 완료 알림</text>

  <path class="line" d="M1070 430 V500"/>
  <text class="note" x="1080" y="458">아니오</text>
  <text class="alertnote" x="1080" y="478">집중 완료 알림</text>

  <path class="line" d="M980 536 H940 V290 H1020 V262"/>
  <text class="note end" x="930" y="400">0초 · 집중 +1</text>
  <text class="alertnote end" x="930" y="420">휴식 완료 알림</text>

  <path class="line" d="M1340 500 V226 H1160"/>
  <text class="note mid" x="1255" y="216">시작 (새 타이머)</text>

  <rect class="box" x="730" y="600" width="320" height="116" rx="14"/>
  <text class="label" x="752" y="628">공통 조작 · 알림 없음</text>
  <text class="small" x="752" y="652">프로필 실행 → 값 적용 후 진행(집중 1)</text>
  <text class="small" x="752" y="675">중지 → 어느 상태에서나 준비</text>
  <text class="small" x="752" y="698">일시정지 ↔ 시작 · 단계·남은 시간 유지</text>

  <rect class="alert" x="1070" y="600" width="310" height="116" rx="14"/>
  <text class="label mid" x="1225" y="628">자연 종료 이벤트 → AlertService</text>
  <text class="small mid" x="1225" y="652">집중 완료 · 휴식 완료 · 타이머 완료</text>
  <text class="small mid" x="1225" y="675">켜진 설정만 소리 반복 (기본 3회)</text>
  <text class="small mid" x="1225" y="698">+ macOS 로컬 알림</text>
</svg>
